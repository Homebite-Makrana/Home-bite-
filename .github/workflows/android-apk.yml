name: HOME BITE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Node dependencies
        run: npm install

      - name: Copy latest HOME BITE web assets
        run: npx cap copy android

      - name: Verify latest HOME BITE UI
        run: |
          grep -q "hb-final-hero" android/app/src/main/assets/public/app.js
          grep -q "hb-final-cats" android/app/src/main/assets/public/app.js
          grep -q "hb-final-shops" android/app/src/main/assets/public/app.js
          echo "HOME BITE v1.0.4 UI verified in Android bundle"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build HOME BITE APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload HOME BITE APK
        uses: actions/upload-artifact@v4
        with:
          name: HOME-BITE-v1.0.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
